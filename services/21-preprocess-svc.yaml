# preprocess-svc: internal only; balances uploads across the 2 preprocess replicas.
apiVersion: v1
kind: Service
metadata:
  name: preprocess-svc
  namespace: imgpipe
  labels:
    app.kubernetes.io/name: kubebalancer
    app.kubernetes.io/component: preprocess
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubebalancer
    app.kubernetes.io/component: preprocess
  ports:
    - name: http
      port: 8081
      targetPort: http
