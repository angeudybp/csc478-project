# storage-svc: internal only; the gateway is its only client, so stored data is never public.
apiVersion: v1
kind: Service
metadata:
  name: storage-svc
  namespace: imgpipe
  labels:
    app.kubernetes.io/name: kubevision
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubevision
    app.kubernetes.io/component: storage
  ports:
    - name: http
      port: 8083
      targetPort: http
